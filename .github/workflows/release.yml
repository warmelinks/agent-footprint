# Publishes to PyPI when a version tag (v0.1.0, ...) is pushed. Uses trusted publishing: PyPI has a
# pending/registered publisher for this repo, workflow release.yml and environment pypi, so no token
# is stored. Uploads with `uv publish` instead of twine, which rejects the Metadata 2.5 hatchling writes.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv run python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Tag matches the version in pyproject.toml
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi
      - run: uv build
      - name: Smoke-test the wheel
        run: uv run --no-project --isolated --with dist/*.whl agent-footprint --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agent-footprint/
    permissions:
      id-token: write   # OIDC token for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
      - run: uv publish --trusted-publishing always dist/*
